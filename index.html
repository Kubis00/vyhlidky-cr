<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vyhlídky ČR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d2a24;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #e2ded3}
h1{font-size:18px;margin:0;margin-right:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip,.btn{border:1px solid #1f7a5a;background:#fff;color:#1f7a5a;padding:6px 12px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on,.btn.main{background:#1f7a5a;color:#fff}
.btn{border-radius:8px;padding:8px 12px}
.wrap{flex:1;display:flex;min-height:0}
#map{flex:1}
#panel{width:360px;overflow-y:auto;padding:14px;background:#fff;border-left:1px solid #e2ded3}
@media(max-width:800px){.wrap{flex-direction:column}#panel{width:100%;height:42%;border-left:0;border-top:1px solid #e2ded3}}
.pin{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0006;cursor:pointer}
.item{padding:10px 2px;border-top:1px solid #eee;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.item small{color:#63706a}
.tag{color:#fff;font-size:12px;padding:2px 8px;border-radius:99px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.facts div{background:#f6f4ef;border-radius:8px;padding:8px;font-size:13px}
.facts b{display:block;font-size:11px;color:#63706a;text-transform:uppercase}
.rev{border-top:1px solid #eee;padding:8px 0;font-size:14px}
input,select,textarea{width:100%;padding:9px;border:1px solid #cfcabd;border-radius:8px;font:inherit;margin:4px 0}
dialog{border:0;border-radius:14px;padding:18px;width:min(360px,92vw)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:13px;color:#b3261e}
.cn{color:#fff;font-size:12px;font-weight:700;pointer-events:none;text-shadow:0 0 2px #0008}
input,select,textarea{font-size:16px}
@supports(height:100dvh){html,body{height:100dvh}}
#sheet{width:360px;display:flex;flex-direction:column;min-height:0;background:#fff;border-left:1px solid #e2ded3}
#grab{display:none}
#panel{flex:1;width:auto;border-left:0;border-top:0;height:auto;min-height:0}
@media(max-width:800px){
  header{padding:8px 10px;gap:6px}
  h1{font-size:17px}
  #who{display:none}
  #q{width:100%!important;order:5}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;font-size:15px;padding:9px 14px;flex:none}
  .btn{font-size:15px;padding:10px 14px}
  .wrap{position:relative;flex-direction:row}
  #map{position:absolute;inset:0}
  #sheet{position:absolute;left:0;right:0;bottom:0;width:100%;height:var(--sh,38%);border-left:0;border-top:1px solid #e2ded3;border-radius:16px 16px 0 0;box-shadow:0 -2px 12px #0003;z-index:3;transition:height .2s}
  #grab{display:block;height:28px;flex:none;cursor:pointer;position:relative}
  #grab::after{content:"";position:absolute;top:11px;left:50%;width:44px;height:5px;margin-left:-22px;background:#cfcabd;border-radius:3px}
  #panel{font-size:16px;padding:4px 14px 20px}
  .item{padding:14px 2px;font-size:16px}
  .facts div{font-size:15px}
  .maplibregl-ctrl-group button{width:44px;height:44px}
}
</style>
</head>
<body>
<header>
<h1>⛰️ Vyhlídky ČR <small style="font-size:11px;color:#63706a;font-weight:400">v10</small></h1>
<input id="q" type="search" placeholder="Hledat podle názvu…" style="width:220px;margin:0">
<span id="who" style="font-size:13px"></span>
<button class="btn" id="addBtn">+ Přidat místo</button>
<button class="btn main" id="authBtn">Přihlásit</button>
<div class="chips" id="chips"></div>
</header>
<div class="wrap"><div id="map"></div><div id="sheet"><div id="grab" role="button" aria-label="Zvětšit nebo zmenšit seznam"></div><div id="panel"></div></div></div>

<dialog id="dlg">
<h3 style="margin-top:0">Přihlášení</h3>
<input id="em" type="email" placeholder="E-mail" autocomplete="email">
<input id="pw" type="password" placeholder="Heslo (min. 6 znaků)" autocomplete="current-password">
<p class="msg" id="amsg"></p>
<div class="row"><button class="btn main" id="doIn">Přihlásit</button><button class="btn" id="doUp">Registrovat</button><button class="btn" id="doX">Zavřít</button></div>
</dialog>

<div id="toast" hidden style="position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#1d2a24;color:#fff;padding:10px 14px;border-radius:10px;z-index:30;font-size:15px"></div>
<div id="locAsk" hidden style="position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:20;background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 18px #0006;font-size:15px;max-width:420px;margin:auto">
<b>Zobrazit místa v okolí?</b>
<p style="margin:6px 0 10px;color:#63706a;font-size:14px">Polohu použijeme jen k vycentrování mapy na tebe. Nikam ji neukládáme.</p>
<div class="row"><button class="btn main" id="locYes">Povolit polohu</button><button class="btn" id="locNo">Teď ne</button></div>
</div>
<div id="addHint" hidden style="position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1f7a5a;color:#fff;padding:10px 14px;border-radius:10px;z-index:5;font-size:14px;box-shadow:0 2px 8px #0005">Klikni do mapy na místo, které chceš přidat <button class="btn" id="aCancel" style="margin-left:8px;padding:4px 10px">Zrušit</button></div>
<dialog id="addDlg">
<h3 style="margin-top:0">Přidat místo</h3>
<input id="an" maxlength="120" placeholder="Název místa">
<select id="ac"><option value="vyhled">Výhled</option><option value="rozhledna">Rozhledna</option><option value="priroda">Příroda</option><option value="poklad">Skrytý poklad</option></select>
<textarea id="ad" rows="3" maxlength="1000" placeholder="Popis místa"></textarea>
<input id="ab" maxlength="120" placeholder="Nejlepší čas (např. západ slunce)">
<input id="aa" maxlength="160" placeholder="Dostupnost (např. 20 min pěšky)">
<input id="ap" maxlength="120" placeholder="Cena (např. zdarma)">
<p class="msg" id="amsg2"></p>
<div class="row"><button class="btn main" id="aSave">Odeslat ke schválení</button><button class="btn" id="aX">Zavřít</button></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://mrzzqdxnkmuaagzmmmwz.supabase.co';
const SB_KEY='sb_publishable_1Kew9sMSypNpNHzE7d7DXQ_J2JXXjfu';
const db=supabase.createClient(SB_URL,SB_KEY);
const CATS={vyhled:['Výhled','#e4572e'],rozhledna:['Rozhledna','#2e86de'],priroda:['Příroda','#2a9d6f'],poklad:['Skrytý poklad','#a55eea']};
let places=[],ratings={},favs=new Set(),user=null,filt='all',sel=null,markers=[];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

const map=new maplibregl.Map({
  container:'map',center:[15.5,49.8],zoom:6.5,attributionControl:false,
  style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© přispěvatelé OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]}
});
map.addControl(new maplibregl.NavigationControl());
map.addControl(new maplibregl.AttributionControl({compact:true}),'top-left');
let meMarker=null;
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false}
function locate(){
  toast('Zjišťuji polohu…');
  if(!navigator.geolocation||!window.isSecureContext){alert('Tento prohlížeč nebo tato stránka polohu nepodporuje. Otevři stránku přímo v Safari nebo Chrome.');return}
  navigator.geolocation.getCurrentPosition(pos=>{
    $('toast').hidden=true;
    const c=[pos.coords.longitude,pos.coords.latitude];
    userPos=c;
    map.flyTo({center:c,zoom:12});
    if(!meMarker){
      const el=document.createElement('div');
      el.style.cssText='width:16px;height:16px;border-radius:50%;background:#2e86de;border:3px solid #fff;box-shadow:0 0 0 2px #2e86de66';
      meMarker=new maplibregl.Marker({element:el});
    }
    meMarker.setLngLat(c).addTo(map);
  },err=>{
    $('toast').hidden=true;
    alert(err.code===1
      ?'Přístup k poloze je zakázaný. Na iPhonu: Nastavení → Soukromí a zabezpečení → Polohové služby → zapnout a u Safari zvolit „Při používání". Pak v Safari klepni na „aA" → Nastavení webu → Poloha → Povolit.'
      :'Polohu se nepodařilo zjistit (kód '+err.code+'). Zkus to venku nebo po chvíli znovu.');
  },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
class LocCtl{
  onAdd(){
    this.c=document.createElement('div');this.c.className='maplibregl-ctrl maplibregl-ctrl-group';
    const b=document.createElement('button');b.type='button';b.title='Moje poloha';b.setAttribute('aria-label','Moje poloha');
    b.style.cssText='display:flex;align-items:center;justify-content:center';
    b.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
    b.onclick=locate;this.c.appendChild(b);return this.c;
  }
  onRemove(){this.c.remove()}
}
map.addControl(new LocCtl());
let mapReady=false;
map.on('load',()=>{
  map.addSource('pl',{type:'geojson',data:{type:'FeatureCollection',features:[]},cluster:true,clusterMaxZoom:12,clusterRadius:45});
  map.addLayer({id:'cl',type:'circle',source:'pl',filter:['has','point_count'],paint:{'circle-color':'#1f7a5a','circle-radius':['step',['get','point_count'],15,20,19,100,24],'circle-stroke-color':'#fff','circle-stroke-width':2}});
  map.addLayer({id:'pt',type:'circle',source:'pl',filter:['!',['has','point_count']],paint:{'circle-color':['match',['get','category'],'vyhled','#e4572e','rozhledna','#2e86de','priroda','#2a9d6f','#a55eea'],'circle-radius':9,'circle-stroke-color':'#fff','circle-stroke-width':2}});
  map.on('click','cl',async e=>{const f=e.features[0];const z=await map.getSource('pl').getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:z})});
  map.on('click','pt',e=>select(e.features[0].properties.id,true));
  ['cl','pt'].forEach(l=>{map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',l,()=>map.getCanvas().style.cursor='')});
  mapReady=true;drawMarkers();
});
map.on('moveend',()=>{if(!sel)drawList()});
let clMarkers={};
function updClusters(){
  if(!mapReady||!map.getLayer('cl'))return;
  const seen={};
  map.querySourceFeatures('pl',{filter:['has','point_count']}).forEach(f=>{
    const id=f.properties.cluster_id;if(seen[id])return;seen[id]=1;
    if(!clMarkers[id]){
      const el=document.createElement('div');el.className='cn';el.textContent=f.properties.point_count_abbreviated;
      clMarkers[id]=new maplibregl.Marker({element:el}).setLngLat(f.geometry.coordinates).addTo(map);
    }
  });
  Object.keys(clMarkers).forEach(id=>{if(!seen[id]){clMarkers[id].remove();delete clMarkers[id]}});
}
map.on('render',()=>{if(mapReady&&map.isSourceLoaded('pl'))updClusters()});

let userPos=null;
const km=p=>{const R=6371,r=Math.PI/180,dLa=(p.lat-userPos[1])*r,dLo=(p.lng-userPos[0])*r;const a=Math.sin(dLa/2)**2+Math.cos(userPos[1]*r)*Math.cos(p.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(a))};
const dist=p=>{if(!userPos)return'';const d=km(p);return ' · '+(d<10?d.toFixed(1).replace('.',','):Math.round(d))+' km'};
let query='';
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function visible(){return places.filter(p=>(filt==='all'||(filt==='fav'?favs.has(p.id):p.category===filt))&&(!query||norm(p.name).includes(query)))}

function drawChips(){
  const items=[['all','Vše'],...Object.entries(CATS).map(([k,v])=>[k,v[0]]),['fav','★ Oblíbené']];
  $('chips').innerHTML=items.map(([k,n])=>`<button class="chip${filt===k?' on':''}" data-k="${k}">${n}</button>`).join('');
}
function drawMarkers(){
  if(!mapReady)return;
  map.getSource('pl').setData({type:'FeatureCollection',features:visible().map(p=>({type:'Feature',properties:{id:p.id,category:p.category},geometry:{type:'Point',coordinates:[p.lng,p.lat]}}))});
}
function stars(id){const r=ratings[id];return r?`★ ${r.avg_rating} (${r.review_count})`:'bez hodnocení'}

function drawList(){
  const bd=map.getBounds();
  const all=query?visible():visible().filter(p=>bd.contains([p.lng,p.lat]));
  const v=all.sort((a,b)=>userPos?km(a)-km(b):(ratings[b.id]?.avg_rating||0)-(ratings[a.id]?.avg_rating||0)).slice(0,50);
  $('panel').innerHTML=`<p style="color:#63706a;font-size:13px;margin-top:0">${all.length} míst ${query?'odpovídá hledání':'v zobrazené oblasti'}${all.length>50?(userPos?' (zobrazeno 50 nejbližších)':' (zobrazeno prvních 50)'):''}</p>`+
    v.map(p=>`<div class="item" data-id="${p.id}"><span><b>${esc(p.name)}</b><br><small>${CATS[p.category][0]}${dist(p)}</small></span><small>${stars(p.id)}</small></div>`).join('');
}
async function select(id,fly){
  sel=places.find(p=>p.id===id);if(!sel)return;
  const mob=innerWidth<=800;
  if(mob&&shi===2){shi=0;$('sheet').style.setProperty('--sh',SH[0])}
  if(fly)map.flyTo({center:[sel.lng,sel.lat],zoom:Math.max(map.getZoom(),11),padding:{bottom:mob?Math.round(innerHeight*0.38):0}});
  const {data:revs}=await db.from('reviews').select('rating,body,created_at').eq('place_id',id).order('created_at',{ascending:false});
  const {data:phs}=await db.from('photos').select('path').eq('place_id',id).order('created_at',{ascending:false});
  const p=sel,fav=favs.has(id);
  $('panel').innerHTML=`<h2 style="margin:0 0 6px">${esc(p.name)}</h2>
  <span class="tag" style="background:${CATS[p.category][1]}">${CATS[p.category][0]}</span> <small>${stars(id)}${dist(p)}</small>
  ${p.photo_url&&p.photo_url.startsWith('https://commons.wikimedia.org/')?`<img src="${esc(p.photo_url)}" alt="${esc(p.name)}" loading="lazy" style="width:100%;border-radius:10px;margin:8px 0 2px"><small><a target="_blank" rel="noopener" href="${esc(p.photo_credit)}">Foto: Wikimedia Commons</a></small>`:''}
  <p style="font-size:14px;line-height:1.5">${esc(p.description)}</p>
  <div class="facts"><div><b>Nejlepší čas</b>${esc(p.best_time||'neuvedeno')}</div><div><b>Dostupnost</b>${esc(p.access_info||'neuvedeno')}</div><div><b>Cena</b>${esc(p.price_info||'neuvedeno')}</div><div><b>Souřadnice</b>${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</div></div>
  <div class="row"><button class="btn main" id="favBtn">${fav?'★ V oblíbených':'☆ Do oblíbených'}</button>
  <a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${p.lat},${p.lng}">Navigovat</a>
  <button class="btn" id="backBtn">Zpět</button></div>
  <h3>Fotky od uživatelů</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${(phs||[]).map(f=>`<img src="${esc(photoUrl(f.path))}" alt="" loading="lazy" style="width:100%;border-radius:8px;aspect-ratio:4/3;object-fit:cover">`).join('')}</div>
  ${(phs||[]).length?'':'<p style="font-size:13px;color:#63706a">Zatím žádné fotky.</p>'}
  ${user?`<input type="file" id="phFile" accept="image/jpeg,image/png,image/webp"><p class="msg" id="phMsg"></p>`:'<p style="font-size:13px;color:#63706a">Pro nahrání fotky se přihlas.</p>'}
  <h3>Recenze</h3>
  ${user?`<select id="rt"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select>
  <textarea id="rb" rows="3" maxlength="2000" placeholder="Jaké to tam bylo?"></textarea>
  <button class="btn main" id="rvBtn">Odeslat recenzi</button><p class="msg" id="rmsg"></p>`:'<p style="font-size:13px;color:#63706a">Pro psaní recenzí se přihlas.</p>'}
  ${(revs||[]).map(r=>`<div class="rev">${'★'.repeat(r.rating)} <small>${new Date(r.created_at).toLocaleDateString('cs-CZ')}</small><br>${esc(r.body)}</div>`).join('')||'<p style="font-size:13px;color:#63706a">Zatím žádné recenze.</p>'}`;
}
async function loadAll(){
  let acc=[],from=0;
  for(;;){
    const {data,error}=await db.from('places').select('*').order('id').range(from,from+999);
    if(error){$('panel').textContent='Chyba načítání: '+error.message;return}
    acc=acc.concat(data);
    if(data.length<1000)break;
    from+=1000;
  }
  places=acc;
  const {data:r}=await db.from('place_ratings').select('*');
  ratings={};(r||[]).forEach(x=>ratings[x.place_id]=x);
  refresh();
}
async function loadFavs(){
  favs=new Set();
  if(user){const {data}=await db.from('favorites').select('place_id');(data||[]).forEach(f=>favs.add(f.place_id))}
  refresh();
}
function refresh(){drawChips();drawMarkers();sel?select(sel.id):drawList()}

document.addEventListener('click',async e=>{
  const t=e.target,c=t.closest('.chip'),it=t.closest('.item');
  if(c){filt=c.dataset.k;sel=null;refresh();return}
  if(it){select(it.dataset.id,true);return}
  if(t.id==='backBtn'){sel=null;drawList();return}
  if(t.id==='favBtn'){
    if(!user){openAuth();return}
    if(favs.has(sel.id)){await db.from('favorites').delete().eq('place_id',sel.id).eq('user_id',user.id);favs.delete(sel.id)}
    else{await db.from('favorites').insert({place_id:sel.id,user_id:user.id});favs.add(sel.id)}
    select(sel.id);return;
  }
  if(t.id==='rvBtn'){
    const {error}=await db.from('reviews').upsert({place_id:sel.id,user_id:user.id,rating:+$('rt').value,body:$('rb').value.trim()},{onConflict:'place_id,user_id'});
    if(error){$('rmsg').textContent=error.message;return}
    await loadAll();select(sel.id);
  }
});

$('q').addEventListener('input',e=>{query=norm(e.target.value);sel=null;refresh()});
function openAuth(){$('amsg').textContent='';$('dlg').showModal()}
$('authBtn').onclick=async()=>{user?await db.auth.signOut():openAuth()};
$('doX').onclick=()=>$('dlg').close();
$('doIn').onclick=async()=>{
  const {error}=await db.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  error?$('amsg').textContent=error.message:$('dlg').close();
};
$('doUp').onclick=async()=>{
  const {data,error}=await db.auth.signUp({email:$('em').value,password:$('pw').value});
  if(error){$('amsg').textContent=error.message;return}
  if(!data.session){$('amsg').style.color='#1f7a5a';$('amsg').textContent='Zkontroluj e-mail a potvrď registraci.'}
  else $('dlg').close();
};
db.auth.onAuthStateChange((_e,s)=>{
  user=s?.user||null;
  $('who').textContent=user?user.email:'';
  $('authBtn').textContent=user?'Odhlásit':'Přihlásit';
  loadFavs();
});
const photoUrl=p=>db.storage.from('place-photos').getPublicUrl(p).data.publicUrl;
function resize(file){return new Promise((ok,no)=>{
  const img=new Image();
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>b?ok(b):no(new Error('Převod obrázku selhal')),'image/jpeg',0.85)};
  img.onerror=()=>no(new Error('Obrázek nelze načíst'));
  img.src=URL.createObjectURL(file);
})}
document.addEventListener('change',async e=>{
  if(e.target.id!=='phFile'||!e.target.files[0]||!user||!sel)return;
  const m=$('phMsg');m.style.color='#63706a';m.textContent='Nahrávám…';
  try{
    const blob=await resize(e.target.files[0]);
    const path=`${user.id}/${sel.id}-${Date.now()}.jpg`;
    const up=await db.storage.from('place-photos').upload(path,blob,{contentType:'image/jpeg'});
    if(up.error)throw up.error;
    const ins=await db.from('photos').insert({place_id:sel.id,user_id:user.id,path});
    if(ins.error)throw ins.error;
    select(sel.id);
  }catch(err){m.style.color='#b3261e';m.textContent=err.message||'Nahrání selhalo'}
});

let locAsked=false;
try{locAsked=localStorage.getItem('locAsked')==='1'}catch(e){}
const rememberLoc=()=>{try{localStorage.setItem('locAsked','1')}catch(e){}};
if(!locAsked)setTimeout(()=>{$('locAsk').hidden=false},1500);
$('locYes').onclick=()=>{$('locAsk').hidden=true;rememberLoc();locate()};
$('locNo').onclick=()=>{$('locAsk').hidden=true;rememberLoc()};
const SH=['38%','85%','12%'];let shi=0;
$('grab').onclick=()=>{shi=(shi+1)%3;$('sheet').style.setProperty('--sh',SH[shi])};
let picking=false,pickLL=null;
$('addBtn').onclick=()=>{if(!user){openAuth();return}picking=true;$('addHint').hidden=false;map.getCanvas().style.cursor='crosshair'};
$('aCancel').onclick=()=>{picking=false;$('addHint').hidden=true;map.getCanvas().style.cursor=''};
map.on('click',e=>{
  if(!picking)return;
  picking=false;$('addHint').hidden=true;map.getCanvas().style.cursor='';
  pickLL=e.lngLat;$('amsg2').textContent='';$('addDlg').showModal();
});
$('aX').onclick=()=>$('addDlg').close();
$('aSave').onclick=async()=>{
  const name=$('an').value.trim();
  if(!name){$('amsg2').textContent='Zadej název místa.';return}
  const {error}=await db.from('places').insert({name,category:$('ac').value,description:$('ad').value.trim(),
    best_time:$('ab').value.trim()||null,access_info:$('aa').value.trim()||null,price_info:$('ap').value.trim()||null,
    lat:pickLL.lat,lng:pickLL.lng,created_by:user.id,status:'pending'});
  if(error){$('amsg2').textContent=error.message;return}
  $('addDlg').close();['an','ad','ab','aa','ap'].forEach(i=>$(i).value='');
  alert('Díky! Místo se ostatním zobrazí po schválení.');
};
loadAll();
</script>
